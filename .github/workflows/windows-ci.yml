name: Windows CI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or commit to verify (defaults to the selected workflow ref)
        required: false
        type: string
      installer_lifecycle:
        description: Build and verify the Windows release installer
        default: false
        type: boolean
      test_name_pattern:
        description: Optional test-name filter for a targeted release recheck (blank runs the full suite)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  windows-build-and-test:
    name: Windows build and tests
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      REFRACT_TEST_HIDDEN: '1'
      REFRACT_TEST_NAME_PATTERN: ${{ inputs.test_name_pattern }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Install external verified TinyTeX for tests
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'TinyTeX-v2026.10.zip'
          Invoke-WebRequest 'https://github.com/rstudio/tinytex-releases/releases/download/v2026.10/TinyTeX-v2026.10.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'dc1d6e63b21af62130ede1dcc4113bffdc184544690a23e3f489d75340f4ff61') {
            throw 'TinyTeX archive checksum mismatch'
          }
          tar -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract TinyTeX' }
          # TinyTeX omits SyncTeX. Fetch the upstream tool only for this runner;
          # neither archive nor toolchain is packaged or uploaded.
          $synctexArchive = Join-Path $env:RUNNER_TEMP 'synctex.windows.r78097.tar.xz'
          Invoke-WebRequest 'https://ctan.math.illinois.edu/systems/texlive/tlnet/archive/synctex.windows.r78097.tar.xz' -OutFile $synctexArchive
          if ((Get-FileHash -LiteralPath $synctexArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '09ff70bf3a0de6b1c81c5aa3eb136473fce83314dc407a9ad6c4592376a6a83c') {
            throw 'SyncTeX archive checksum mismatch'
          }
          tar -xf $synctexArchive -C (Join-Path $env:RUNNER_TEMP 'TinyTeX') 'bin/windows/synctex.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract test-only SyncTeX' }
          $texBin = Join-Path $env:RUNNER_TEMP 'TinyTeX/bin/windows'
          ./scripts/setup-tex.ps1 -TexBin $texBin
          "REFRACT_TEX_BIN=$texBin" >> $env:GITHUB_ENV
      - name: Build TypeScript and run tests
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testArgs = @('--test', '--test-concurrency=2')
          if ($env:REFRACT_TEST_NAME_PATTERN) {
            $testArgs += "--test-name-pattern=$env:REFRACT_TEST_NAME_PATTERN"
          }
          $testArgs += 'build/test/*.test.cjs'
          node @testArgs

      - name: Build release installer
        if: inputs.installer_lifecycle
        run: npm run build:installer -- --publish=never
      - name: Run installer lifecycle
        if: inputs.installer_lifecycle
        env:
          REFRACT_TEST_INSTALLER: '1'
          REFRACT_TEX_BIN: ''
        run: |
          $env:REFRACT_TEST_INSTALLER_PATH = @(Get-ChildItem dist -Filter '*Setup*.exe').FullName
          $cache = Join-Path $env:LOCALAPPDATA 'electron-builder/Cache'
          $compilerDirectory = Join-Path $cache 'nsis/nsis-3.0.4.1'
          if (!(Test-Path (Join-Path $compilerDirectory 'makensis.exe'))) {
            $compiler = Get-ChildItem (Join-Path $cache 'nsis-3.0.4.1') -Recurse -Filter makensis.exe | Select-Object -First 1
            if (!$compiler) { throw 'The installer build did not cache the NSIS compiler' }
            New-Item -ItemType Directory -Path (Split-Path $compilerDirectory) -Force | Out-Null
            Copy-Item -LiteralPath $compiler.DirectoryName -Destination $compilerDirectory -Recurse
          }
          node --test --test-reporter=tap build/test/installer.test.cjs build/test/installer-dependencies.test.cjs | Tee-Object -Variable results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($results -notcontains '# skipped 0') { throw 'An installer test was skipped' }
      - name: Upload verified release files
        if: inputs.installer_lifecycle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/*Setup*.exe
            dist/*Setup*.exe.blockmap
            dist/*.yml
            !dist/builder-*.yml
