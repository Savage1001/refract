name: Native Windows package

on:
  pull_request:
    paths:
      - native/**
      - scripts/installer.nsh
      - scripts/native-windows/**
      - resources/logo.ico
      - package.json
      - package-lock.json
      - .github/workflows/native-windows-package.yml

permissions:
  contents: read

concurrency:
  group: native-windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install package build dependencies and check TypeScript
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx --no-install tsc --noEmit
      - name: Build native application and dependency installer
        run: |
          cargo +stable build --locked --manifest-path native/Cargo.toml --bin refract-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable build --locked --manifest-path native/Cargo.toml --no-default-features --features installer --bin refract-install-dependencies
      - name: Package the x64 application
        run: |
          node --experimental-strip-types scripts/native-windows/package.cts native/target/debug/refract-native.exe native/target/debug/refract-install-dependencies.exe native/target/installer/windows
      - name: Verify silent install, upgrade, and uninstall
        run: node --experimental-strip-types scripts/native-windows/verify.cts native/target/installer/windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refract-native-windows-x64
          path: native/target/installer/windows/Refract-Native-Setup-*.exe
          if-no-files-found: error
