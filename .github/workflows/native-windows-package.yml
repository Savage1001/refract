name: Native Windows package

on:
  pull_request:
    paths:
      - native/**
      - scripts/installer.nsh
      - scripts/native-windows/**
      - resources/logo.ico
      - resources/fonts/Inter-OFL.txt
      - package.json
      - package-lock.json
      - .github/workflows/native-windows-package.yml
  workflow_call:
    inputs:
      release-ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: native-windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install package build dependencies and compile the distribution hooks
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Build native application and dependency installer
        run: |
          cargo +stable build --locked --release --manifest-path native/Cargo.toml --bin refract-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +stable build --locked --release --manifest-path native/Cargo.toml --no-default-features --features installer --bin refract-install-dependencies
      - name: Package the x64 application
        if: inputs.release-ref == ''
        run: |
          node --experimental-strip-types scripts/native-windows/package.cts native/target/release/refract-native.exe native/target/release/refract-install-dependencies.exe native/target/installer/windows
      - name: Package Windows update assets for Electron and native clients
        run: |
          node --experimental-strip-types scripts/native-windows/package.cts native/target/release/refract-native.exe native/target/release/refract-install-dependencies.exe native/target/installer/windows-release-assets --release-assets
      - name: Package the existing Electron application for the upgrade test
        run: npm run build:installer -- --publish never -c.directories.output=native/target/installer/electron-baseline
      - name: Verify silent install, upgrade, and uninstall
        run: node --experimental-strip-types scripts/native-windows/verify.cts native/target/installer/windows-release-assets --release-assets native/target/installer/electron-baseline
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.release-ref == ''
        with:
          name: refract-native-windows-x64
          path: native/target/installer/windows/Refract-Native-Setup-*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.release-ref && 'windows-installer' || 'refract-native-windows-release-assets' }}
          path: |
            native/target/installer/windows-release-assets/Refract-Setup-*.exe
            native/target/installer/windows-release-assets/Refract-Setup-*.exe.blockmap
            native/target/installer/windows-release-assets/Refract-Native-Setup-*.sha256
            native/target/installer/windows-release-assets/latest.yml
            native/target/installer/windows-release-assets/beta.yml
          if-no-files-found: error
