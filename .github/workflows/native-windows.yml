name: Native preview

on:
  pull_request:
    paths:
      - native/**
      - .github/workflows/native-windows.yml
      - scripts/capture-electron-parity.cts

permissions:
  contents: read

concurrency:
  group: native-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
      - name: Test project library
        run: cargo +stable test --locked --no-default-features --features latex-syntax
      - name: Verify LaTeX and SyncTeX with TinyTeX
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'TinyTeX-v2026.10.zip'
          Invoke-WebRequest 'https://github.com/rstudio/tinytex-releases/releases/download/v2026.10/TinyTeX-v2026.10.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'dc1d6e63b21af62130ede1dcc4113bffdc184544690a23e3f489d75340f4ff61') {
            throw 'TinyTeX archive checksum mismatch'
          }
          tar -xf $archive -C $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract TinyTeX' }
          $tools = Join-Path $env:RUNNER_TEMP 'TinyTeX'
          $syncArchive = Join-Path $env:RUNNER_TEMP 'synctex.windows.r78097.tar.xz'
          $syncHash = '09ff70bf3a0de6b1c81c5aa3eb136473fce83314dc407a9ad6c4592376a6a83c'
          $syncVerified = $false
          foreach ($mirror in @('https://mirrors.ctan.org', 'https://mirrors.mit.edu/CTAN', 'https://ctan.math.illinois.edu')) {
            try {
              Invoke-WebRequest "$mirror/systems/texlive/tlnet/archive/synctex.windows.r78097.tar.xz" -TimeoutSec 25 -OutFile $syncArchive
              if ((Get-FileHash -LiteralPath $syncArchive -Algorithm SHA256).Hash -ne $syncHash) {
                throw 'Archive checksum mismatch'
              }
              $syncVerified = $true
              break
            } catch {
              Write-Warning "SyncTeX archive from $mirror failed: $($_.Exception.Message)"
            }
          }
          if (!$syncVerified) { throw 'Could not download the verified SyncTeX archive' }
          tar -xf $syncArchive -C $tools 'bin/windows/synctex.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Failed to extract SyncTeX' }
          $env:REFRACT_TEX_BIN = Join-Path $tools 'bin/windows'
          cargo +stable test --locked --no-default-features --lib tex::tests::compiles_with_the_configured_toolchain -- --ignored
      - name: Build GPUI preview
        run: cargo +stable build --locked
      - name: Test GPUI keyboard interaction
        run: cargo +stable test --locked --bin refract-native --features ui-tests

  unix:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: native
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test project library and PDF rendering
        run: cargo +stable test --locked --no-default-features --features latex-syntax,portable-pdf
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libwayland-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Check the native application
        run: cargo +stable check --locked --bin refract-native
      - name: Build for visual verification
        if: runner.os == 'Linux'
        run: cargo +stable build --locked --bin refract-native
      - name: Capture the native library and workspace offscreen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends imagemagick mesa-vulkan-drivers texlive-latex-base texlive-latex-recommended xauth xdotool xvfb
          profile=$(mktemp -d "$RUNNER_TEMP/refract-native-profile.XXXXXX")
          output="$RUNNER_TEMP/refract-native-reference"
          mkdir -p "$output"
          names=('Spectral methods for fluid dynamics' 'Conference paper - autumn notes' 'A short introduction to graph theory')
          for i in "${!names[@]}"; do
            id=$(printf '2b98e215-1a9f-4f24-972b-%012d' "$i")
            folder="$profile/projects/$id"
            mkdir -p "$folder"
            printf '{"id":"%s","name":"%s","created":"2026-01-01T12:00:00.000Z","rootFile":"main.tex"}\n' "$id" "${names[$i]}" > "$folder/.refract.json"
            mkdir -p "$folder/sections"
            cat > "$folder/main.tex" <<'TEX'
          \documentclass[11pt]{article}
          \usepackage[margin=1in]{geometry}
          \title{Spectral methods}
          \author{Research notes}
          \date{Working draft}
          \begin{document}
          \maketitle
          \section{Introduction}
          A stable spectral approximation for fluid dynamics.
          \end{document}
          TEX
            printf '%% Research notes\nA stable spectral approximation.\n' > "$folder/sections/abstract.tex"
          done
          export REFRACT_DATA_DIR="$profile"
          export WAYLAND_DISPLAY= ZED_ALLOW_EMULATED_GPU=1
          xvfb-run -a -s '-screen 0 1600x1000x24' bash -e -u -o pipefail -s -- "$output" <<'CAPTURE'
          output=$1
          ./target/debug/refract-native > "$output/native.log" 2>&1 &
          app=$!
          trap 'kill "$app" 2>/dev/null || true; wait "$app" 2>/dev/null || true' EXIT
          client=$(timeout 20s xdotool search --sync --onlyvisible --pid "$app" | sed -n '1p')
          timeout 10s xdotool windowmove --sync "$client" 0 0
          timeout 10s xdotool windowsize --sync "$client" 1440 900
          xdotool mousemove --sync 0 0
          capture() {
            local screen=$1 expected_width=$2 expected_height=$3 width height colors
            local shot="$output/light-$screen.png"
            for attempt in {1..12}; do
              import -window "$client" "$shot"
              read -r width height colors < <(identify -format '%w %h %k\n' "$shot")
              if (( width == expected_width && height == expected_height && colors > 32 )); then
                return 0
              fi
              sleep 0.2
            done
            echo "The Refract $screen did not render at ${expected_width}×${expected_height}" >&2
            return 1
          }
          capture library-list 1440 900
          xdotool mousemove --window "$client" 340 615 click 1
          xdotool mousemove --sync 0 0
          for attempt in {1..40}; do
            if compgen -G "$REFRACT_DATA_DIR/projects/*/.refract-build/main.pdf" > /dev/null; then
              sleep 1
              break
            fi
            sleep 0.25
          done
          capture workspace 1440 900
          if ! compgen -G "$REFRACT_DATA_DIR/projects/*/.refract-build/main.pdf" > /dev/null; then
            echo 'The workspace fixture did not compile' >&2
            exit 1
          fi
          timeout 10s xdotool windowsize --sync "$client" 900 650
          capture workspace-compact 900 650
          CAPTURE
      - name: Upload native visual verification artifacts
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refract-native-reference
          path: ${{ runner.temp }}/refract-native-reference
          if-no-files-found: ignore

  electron-reference:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - name: Build the existing renderer
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Verify reference interactions and packaging
        run: |
          node --test --test-concurrency=1 build/test/workflow-navigation-headless.test.cjs build/test/pane-layout-headless.test.cjs build/test/outline-layout.test.cjs build/test/ui-polish-headless.test.cjs build/test/pdf-memory-headless.test.cjs build/test/distribution-boundary.test.cjs
      - name: Capture screenshots of the reference UI
        run: node build/scripts/capture-electron-parity.cjs "$env:RUNNER_TEMP/refract-electron-reference"
      - name: Upload reference screenshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: refract-electron-reference
          path: ${{ runner.temp }}/refract-electron-reference
          if-no-files-found: error
