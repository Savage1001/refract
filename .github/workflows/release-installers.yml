name: Release installers

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Latest GitHub main commit SHA
        required: true
        type: string
      platform:
        description: Build all platforms or select installers for a supplemental release
        type: choice
        default: all
        options: [all, macos-linux, linux, arch]

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - name: Require the current main commit
        id: verify
        env:
          REQUESTED: ${{ inputs.ref }}
        run: |
          sha=$(git rev-parse HEAD)
          if [[ "$REQUESTED" != "$sha" ]]; then
            echo 'Build the release using the latest GitHub main SHA.' >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  windows:
    if: inputs.platform == 'all'
    needs: source
    uses: ./.github/workflows/native-windows-package.yml
    with:
      release-ref: ${{ needs.source.outputs.sha }}

  macos:
    if: inputs.platform == 'all' || inputs.platform == 'macos-linux'
    needs: source
    uses: ./.github/workflows/native-macos-package.yml
    with:
      release-ref: ${{ needs.source.outputs.sha }}

  linux:
    needs: source
    uses: ./.github/workflows/native-linux-packages.yml
    with:
      release-ref: ${{ needs.source.outputs.sha }}
      release-debian: ${{ inputs.platform != 'arch' }}
