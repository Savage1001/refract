name: Release installers

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Release commit SHA
        required: true
        type: string
      platform:
        description: Build all platforms or only Linux for a supplemental release asset
        type: choice
        default: all
        options: [all, linux]

permissions:
  contents: read

jobs:
  windows:
    if: inputs.platform != 'linux'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      REFRACT_TEST_HIDDEN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:installer -- --publish never
      - name: Verify Windows packaging and dependency setup
        run: node --test build/test/distribution-boundary.test.cjs build/test/install-dependencies.test.cjs build/test/installer-dependencies.test.cjs build/test/updates.test.cjs
      - name: Verify stable install, upgrade, and uninstall
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '-') {
            $env:REFRACT_TEST_INSTALLER = '1'
            node --test build/test/installer.test.cjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Match Windows asset names to GitHub update metadata
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $channel = if ($version -match '-') { 'beta' } else { 'latest' }
          $metadata = Get-Content "dist/$channel.yml" -Raw
          $name = "Refract-Setup-$version.exe"
          if ($metadata -notmatch [regex]::Escape($name)) {
            throw "Release metadata does not reference $name"
          }
          Rename-Item -LiteralPath "dist/Refract Setup $version.exe" -NewName $name
          Rename-Item -LiteralPath "dist/Refract Setup $version.exe.blockmap" -NewName "$name.blockmap"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: |
            dist/Refract-Setup-*.exe
            dist/Refract-Setup-*.exe.blockmap
            dist/*.yml
            !dist/builder-*.yml
          if-no-files-found: error

  macos:
    if: inputs.platform != 'linux'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            mach_arch: arm64
          - runner: macos-15-intel
            arch: x64
            mach_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CI: 'true'
      REFRACT_TEST_HIDDEN: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:mac -- --${{ matrix.arch }} -c.mac.identity=-
      - name: Install checksum-verified TinyTeX for the smoke test
        run: |
          archive=TinyTeX-darwin-v2026.10.tar.xz
          curl --fail --location --retry 3 "https://github.com/rstudio/tinytex-releases/releases/download/v2026.10/$archive" -o "$RUNNER_TEMP/$archive"
          cd "$RUNNER_TEMP"
          echo "9962e445b56f06feb2c28f73561e523e89d550e98abf910ba60b0ffb3856921f  $archive" | shasum -a 256 --check
          tar -xf "$archive"
          tex="$(find "$RUNNER_TEMP" -name pdflatex -print -quit)"
          test -x "$tex"
          echo "REFRACT_TEX_BIN=$(dirname "$tex")" >> "$GITHUB_ENV"
      - name: Verify the disk image and compile in the packaged app
        run: |
          dmg=(dist/Refract-*-mac-${{ matrix.arch }}.dmg)
          hdiutil verify "${dmg[0]}"
          mount="$RUNNER_TEMP/refract-dmg"
          hdiutil attach "${dmg[0]}" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          export REFRACT_TEST_PACKAGED_APP="$mount/Refract.app/Contents/MacOS/Refract"
          lipo "$REFRACT_TEST_PACKAGED_APP" -verify_arch ${{ matrix.mach_arch }}
          codesign --verify --deep --strict "$mount/Refract.app"
          node --test --test-name-pattern='^(packaged application compiles a project|macOS staging accepts only links confined to an Electron framework)$' build/test/packaged.test.cjs build/test/distribution-boundary.test.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-${{ matrix.arch }}-installer
          path: dist/Refract-*-mac-${{ matrix.arch }}.dmg
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      REFRACT_TEST_HIDDEN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:linux -- --x64
      - name: Install TeX and a virtual display for tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-xetex lmodern xvfb xauth
          sudo apt-get install -y ./dist/Refract-*-linux-x64.deb
          command -v pdflatex xelatex synctex
      - name: Test the installed Debian package
        env:
          REFRACT_TEST_PACKAGED_APP: /opt/Refract/refract
        run: |
          test "$(dpkg-deb -f dist/Refract-*-linux-x64.deb Architecture)" = amd64
          xvfb-run -a --server-args='-screen 0 1600x1000x24' node --test --test-name-pattern='^packaged application (compiles a project|navigates between source and PDF)$' build/test/packaged.test.cjs
          sudo apt-get remove -y refract
          test ! -e "$REFRACT_TEST_PACKAGED_APP"
      - name: Test the AppImage and distribution boundary
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          export REFRACT_TEST_PACKAGED_APP="$(realpath dist/Refract-*-linux-x64.AppImage)"
          xvfb-run -a --server-args='-screen 0 1600x1000x24' node --test --test-name-pattern='^packaged application compiles a project$' build/test/packaged.test.cjs
          node --test build/test/distribution-boundary.test.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-x64-installers
          path: |
            dist/Refract-*-linux-x64.deb
            dist/Refract-*-linux-x64.AppImage
          if-no-files-found: error
