[package]
name = "refract-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:gpui", "dep:gpui-component", "dep:windows"]
ui-tests = ["desktop", "gpui/test-support"]

[[bin]]
name = "refract-native"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui = { version = "=0.2.2", optional = true }
gpui-component = { version = "=0.5.1", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(windows)'.dependencies]
dunce = "=1.0.5"
windows = { version = "=0.61.3", optional = true, features = ["Data_Pdf", "Foundation", "Graphics_Imaging", "Storage_Streams", "Win32_System_WinRT"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }
