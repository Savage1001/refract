[package]
name = "refract-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[features]
default = ["desktop"]
desktop = ["dep:async-channel", "dep:base64", "dep:gpui", "dep:gpui-component", "dep:icu_collator", "dep:icu_locale_core", "dep:image", "dep:katex-native", "dep:markdown", "dep:resvg", "dep:sys-locale", "dep:url", "dep:windows", "latex-syntax", "portable-pdf"]
latex-syntax = ["dep:cc", "dep:tree-sitter", "dep:tree-sitter-language"]
portable-pdf = ["dep:hayro"]
ui-tests = ["desktop", "gpui/test-support"]

[[bin]]
name = "refract-native"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
async-channel = { version = "=2.5.0", optional = true }
base64 = { version = "=0.22.1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }
gpui = { version = "=0.2.2", optional = true }
gpui-component = { version = "=0.5.1", default-features = false, optional = true }
getrandom = "=0.4.3"
httparse = "=1.10.1"
icu_collator = { version = "=2.4.0", optional = true }
icu_locale_core = { version = "=2.4.0", optional = true }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"], optional = true }
katex-native = { version = "=0.1.1", features = ["raster"], optional = true }
markdown = { version = "=1.0.0", optional = true }
regex = "1"
resvg = { version = "=0.45.1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
subtle = "=2.6.1"
sys-locale = { version = "=0.3.2", optional = true }
tempfile = "3"
tree-sitter = { version = "=0.25.10", optional = true }
tree-sitter-language = { version = "0.1", optional = true }
url = { version = "=2.5.9", optional = true }
uuid = { version = "1", features = ["v4"] }
zip = { version = "=9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[build-dependencies]
cc = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
dunce = "=1.0.5"
windows = { version = "=0.61.3", optional = true, features = ["Data_Pdf", "Foundation", "Graphics_Imaging", "Storage_Streams", "Win32_System_WinRT"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
hayro = { version = "=0.9.0", optional = true }
rustix = { version = "=1.1.6", features = ["fs", "process"] }
